<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - AI Foresight Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --lockton-black: #000000;
            --lockton-white: #ffffff;
            --lockton-jet: #363636;
            --lockton-silver: #888888;
            --lockton-blue: #00aeef;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, var(--lockton-black) 0%, var(--lockton-jet) 55%, #141414 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--lockton-white);
        }
        .box {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: var(--lockton-white);
            margin-bottom: 6px;
        }
        .subtitle {
            color: var(--lockton-silver);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--lockton-silver);
            margin-bottom: 6px;
        }
        .pw-wrapper { position: relative; display: flex; align-items: center; }
        .pw-wrapper input { padding-right: 48px; }
        .pw-toggle {
            position: absolute; right: 14px;
            background: none; border: none; cursor: pointer; padding: 0;
            color: var(--lockton-silver); display: flex; align-items: center;
            transition: color 0.2s;
        }
        .pw-toggle:hover { color: var(--lockton-blue); }
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            border: 2px solid rgba(0, 174, 239, 0.4);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            transition: all 0.3s ease;
        }
        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--lockton-blue);
            box-shadow: 0 0 20px rgba(0, 174, 239, 0.25);
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--lockton-black);
            background: linear-gradient(135deg, var(--lockton-blue), #7bd2f7);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 174, 239, 0.3);
        }
        .error {
            background: rgba(255, 33, 71, 0.12);
            border: 1px solid rgba(255, 33, 71, 0.4);
            border-radius: 8px;
            padding: 12px;
            color: #ffb3c1;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .success {
            background: rgba(0, 200, 100, 0.12);
            border: 1px solid rgba(0, 200, 100, 0.4);
            border-radius: 8px;
            padding: 16px;
            color: #a3f0c8;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .back-link {
            display: block;
            margin-top: 22px;
            color: var(--lockton-silver);
            font-size: 0.85rem;
            text-decoration: none;
        }
        .back-link:hover { color: var(--lockton-blue); }
    </style>
</head>
<body>
    <div class="box">
        <h1>Change Password</h1>
        <p class="subtitle">Update your account password</p>

        {% if success %}
        <div class="success">Password updated successfully.</div>
        <a class="back-link" href="/">&larr; Back to app</a>
        {% else %}
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/change-password">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <div class="pw-wrapper">
                    <input type="password" id="current_password" name="current_password" placeholder="Enter current password" required autofocus autocomplete="off">
                    <button type="button" class="pw-toggle" onclick="togglePw('current_password', this)" title="Show/hide">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <div class="pw-wrapper">
                    <input type="password" id="new_password" name="new_password" placeholder="At least 8 characters" required autocomplete="off">
                    <button type="button" class="pw-toggle" onclick="togglePw('new_password', this)" title="Show/hide">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <div class="pw-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat new password" required autocomplete="off">
                    <button type="button" class="pw-toggle" onclick="togglePw('confirm_password', this)" title="Show/hide">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="submit-btn">Update Password</button>
        </form>
        <a class="back-link" href="/">&larr; Back to app</a>
        {% endif %}
    </div>
<script>
function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.querySelector('svg').innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}
</script>
</body>
</html>
