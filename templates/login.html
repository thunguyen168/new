<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockton Foresight Intelligence — Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Particle canvas sits fixed behind everything */
        #particleCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Wrapper keeps card + footer together, above canvas */
        .login-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Card */
        .login-card {
            width: 100%;
            background: #ffffff;
            border: 1px solid #e0eaf4;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 24px rgba(10, 22, 40, 0.08), 0 1px 4px rgba(10, 22, 40, 0.04);
            text-align: center;
        }

        /* Brand mark */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: #0a1628;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-wordmark-name {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #0a1628;
            line-height: 1.15;
            text-align: left;
        }

        .brand-wordmark-sub {
            font-size: 9px;
            letter-spacing: 1.5px;
            color: #00aeef;
            line-height: 1;
            text-align: left;
        }

        .divider {
            border: none;
            border-top: 1px solid #e0eaf4;
            margin: 0 0 24px;
        }

        /* Welcome heading */
        .welcome {
            font-size: 20px;
            font-weight: 700;
            color: #0a1628;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
        }

        /* Error */
        .error {
            background: #fce4ec;
            border: 1px solid rgba(198, 40, 40, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: #c62828;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 18px;
            text-align: left;
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #6b7a90;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 13px;
            background: #f8fafc;
            border: 1px solid #d0dce8;
            border-radius: 8px;
            color: #0a1628;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #00aeef;
            box-shadow: 0 0 0 3px rgba(0, 174, 239, 0.12);
            background: #ffffff;
        }

        input::placeholder { color: #a0afc0; }

        /* Password toggle wrapper */
        .pw-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .pw-wrapper input { padding-right: 42px; }

        .pw-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            color: #a0afc0;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .pw-toggle:hover { color: #00aeef; }

        /* Login button */
        .login-btn {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            background: #0a1628;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: background 0.25s, transform 0.15s;
        }

        .login-btn:hover {
            background: #00aeef;
            transform: translateY(-1px);
        }

        .login-btn:active { transform: translateY(0); }

        /* Admin link */
        .admin-link {
            display: block;
            margin-top: 20px;
            font-size: 12px;
            color: #a0afc0;
            text-decoration: none;
            transition: color 0.2s;
        }

        .admin-link:hover { color: #00aeef; }

        /* Footer below card */
        .login-footer {
            font-size: 11px;
            color: #8898aa;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="login-wrap">
        <div class="login-card">

            <!-- Brand mark -->
            <div class="brand">
                <div class="brand-logo">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="10" r="8.2" stroke="#00aeef" stroke-width="1.3"/>
                        <ellipse cx="10" cy="10" rx="3.5" ry="8.2" stroke="#00aeef" stroke-width="1.3"/>
                        <line x1="1.8" y1="10" x2="18.2" y2="10" stroke="#00aeef" stroke-width="1.3"/>
                        <line x1="3" y1="6.2" x2="17" y2="6.2" stroke="#00aeef" stroke-width="1.1"/>
                        <line x1="3" y1="13.8" x2="17" y2="13.8" stroke="#00aeef" stroke-width="1.1"/>
                    </svg>
                </div>
                <div class="brand-wordmark">
                    <div class="brand-wordmark-name">LOCKTON</div>
                    <div class="brand-wordmark-sub">FORESIGHT INTELLIGENCE</div>
                </div>
            </div>

            <hr class="divider">

            <h2 class="welcome">Welcome back</h2>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Email</label>
                    <input type="email" id="username" name="username" placeholder="you@lockton.com" required autofocus autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="pw-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="pw-toggle" onclick="togglePw('password', this)" title="Show/hide password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <a href="/admin" class="admin-link">Admin panel</a>
        </div>

        <p class="login-footer">Lockton Foresight Intelligence &middot; Proprietary Tool</p>
    </div>

<script>
function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.querySelector('svg').innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

// Particle network animation
(function () {
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const COUNT = 60;
    const CONNECT_DIST = 130;
    const SPEED = 0.35;

    let W, H, particles;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    function randRange(min, max) {
        return Math.random() * (max - min) + min;
    }

    function makeParticle() {
        return {
            x:  Math.random() * W,
            y:  Math.random() * H,
            vx: randRange(-SPEED, SPEED),
            vy: randRange(-SPEED, SPEED),
            r:  randRange(1.5, 3),
        };
    }

    function init() {
        resize();
        particles = Array.from({ length: COUNT }, makeParticle);
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);

        // Update positions
        for (const p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > W) p.vx *= -1;
            if (p.y < 0 || p.y > H) p.vy *= -1;
        }

        // Draw connecting lines
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < CONNECT_DIST) {
                    const alpha = (1 - dist / CONNECT_DIST) * 0.18;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(0, 174, 239, ${alpha})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        // Draw dots
        for (const p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 174, 239, 0.28)';
            ctx.fill();
        }

        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => {
        resize();
        // Clamp existing particles back into bounds after resize
        for (const p of particles) {
            p.x = Math.min(p.x, W);
            p.y = Math.min(p.y, H);
        }
    });

    init();
    draw();
})();
</script>
</body>
</html>
